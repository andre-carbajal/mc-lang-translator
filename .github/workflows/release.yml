name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish Plugin
    runs-on: ubuntu-latest

    steps:
      - name: Fetch Sources
        uses: actions/checkout@v6

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Check Tag Matches Gradle Version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROJECT_VERSION="$(grep '^version[[:space:]]*=' gradle.properties | cut -d'=' -f2 | xargs)"
          if [[ "$TAG_VERSION" != "$PROJECT_VERSION" ]]; then
            echo "::error title=Version mismatch::Tag $GITHUB_REF_NAME expects gradle.properties version=$TAG_VERSION, but the checked-out commit has version=$PROJECT_VERSION."
            echo "Fix: update gradle.properties and CHANGELOG.md, commit and push, then create a new tag that matches the Gradle version."
            exit 1
          fi

      - name: Test
        run: ./gradlew test

      - name: Verify Plugin Structure
        run: ./gradlew verifyPluginStructure

      - name: Publish Plugin To JetBrains Marketplace
        env:
          PUBLISH_TOKEN: ${{ secrets.PUBLISH_TOKEN }}
        run: ./gradlew publishPlugin

      - name: Upload Plugin Artifact
        uses: actions/upload-artifact@v7
        with:
          name: plugin-distribution
          path: ./build/distributions/*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" ./build/distributions/*.zip \
            --title "$GITHUB_REF_NAME" \
            --notes "Published MC Lang Translator $GITHUB_REF_NAME to JetBrains Marketplace."
